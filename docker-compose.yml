services:
  postgres:
    image: postgres:16-alpine
    container_name: daery-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: daery
      POSTGRES_PASSWORD: daery
      POSTGRES_DB: daery
    ports:
      - "5432:5432"
    volumes:
      - daery-postgres-data:/var/lib/postgresql/data

volumes:
  daery-postgres-data:
