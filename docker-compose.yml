services:
  postgres:
    image: postgres:16-alpine
    container_name: daery-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: daery
      POSTGRES_PASSWORD: daery
      POSTGRES_DB: daery
    ports:
      - "5432:5432"
    volumes:
      - daery-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: daery-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - daery-redis-data:/data

volumes:
  daery-postgres-data:
  daery-redis-data:
